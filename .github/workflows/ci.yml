name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [test, lint, check, build-js, e2e, lint-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: cp .env.example .env
      - name: Cache Playwright Chromium
        if: matrix.check == 'e2e'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Playwright Chromium
        if: matrix.check == 'e2e'
        run: bunx playwright install --with-deps chromium
      - name: Setup Node 24 reference
        if: matrix.check == 'test'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build app for e2e
        if: matrix.check == 'e2e'
        run: bun run build
      - run: make ${{ matrix.check }}
        env:
          # E2E credentials are needed by both:
          #   - `test` matrix entry → vitest exercises e2e-harness.test.ts which
          #     invokes tests/e2e/global-setup.ts → seedAdminUser() → requires
          #     E2E_ADMIN_EMAIL on CI (throws if missing).
          #   - `e2e` matrix entry → Playwright login fixture uses the same vars.
          # Inject unconditionally for all matrix entries so the credential is
          # always available; non-consumers ignore the unused env.
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      - name: Upload Playwright report
        if: always() && matrix.check == 'e2e'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  bun-test-shadow:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: cp .env.example .env
      - name: Run Bun Test shadow
        shell: bash
        env:
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          mkdir -p docs/benchmarks/bun-test
          set +e
          bun run test:parity > docs/benchmarks/bun-test/shadow-parity.log 2>&1
          parity_status=$?
          bun run test:bun > docs/benchmarks/bun-test/shadow-bun-test.log 2>&1
          bun_status=$?
          PARITY_STATUS=$parity_status BUN_STATUS=$bun_status bun run scripts/write-shadow-result.ts \
            --parity-log docs/benchmarks/bun-test/shadow-parity.log \
            --bun-log docs/benchmarks/bun-test/shadow-bun-test.log \
            --output docs/benchmarks/bun-test/shadow-result.json \
            --commit "$GITHUB_SHA"
          exit 0
      - name: Upload Bun Test shadow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bun-test-shadow-${{ github.run_id }}
          path: docs/benchmarks/bun-test/
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runner image
        run: docker build --target runner -t blog-runner-test .
      - name: Start DB
        run: |
          docker network create blog || true
          docker run -d --name db --network blog \
            -e POSTGRES_DB=blog -e POSTGRES_USER=blog -e POSTGRES_PASSWORD=blog \
            postgres:16-alpine
          sleep 5
      - name: Test db:migrate inside container
        run: |
          docker run --rm \
            --network blog \
            -e DATABASE_URL=postgres://blog:blog@db:5432/blog \
            blog-runner-test \
            bun run db:migrate

  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  branch-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          echo "$BRANCH_NAME" | \
          grep -qE '^((feat|fix|chore|docs|test|refactor|ci|hotfix)/[a-z0-9][a-z0-9-]*|post/[a-z][a-z-]*/[a-z0-9][a-z0-9-]*)$' || \
          { echo "Branch must match <feat|fix|chore|docs|test|refactor|ci|hotfix>/<slug> or post/<lang>/<slug>"; exit 1; }
