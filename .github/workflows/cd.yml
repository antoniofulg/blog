name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-production
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == github.sha
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify checkout SHA
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: runner
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}
      - name: Deploy with Dokploy
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}
          DOKPLOY_URL: https://dokploy.antoniofulg.tech
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          image_payload="$(jq --null-input --compact-output \
            --arg applicationId "${DOKPLOY_APPLICATION_ID}" \
            --arg dockerImage "${IMAGE}" \
            '{applicationId: $applicationId, dockerImage: $dockerImage, username: null, password: null, registryUrl: "ghcr.io"}')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "x-api-key: ${DOKPLOY_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "${image_payload}" \
            "${DOKPLOY_URL}/api/application.saveDockerProvider"

          deploy_payload="$(jq --null-input --compact-output \
            --arg applicationId "${DOKPLOY_APPLICATION_ID}" \
            --arg title "Deploy ${DEPLOY_SHA}" \
            '{applicationId: $applicationId, title: $title}')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "x-api-key: ${DOKPLOY_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "${deploy_payload}" \
            "${DOKPLOY_URL}/api/application.deploy"
